services:
  - type: web
    name: url-safe
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: URLSAFE_ENV
        value: production
      - key: URLSAFE_ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: URLSAFE_DB_PATH
        value: /tmp/url_safe.sqlite3
