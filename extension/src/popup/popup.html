<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>url_safe</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" type="module"></script>
  </head>
  <body>
    <header class="popup-header">
      <span class="wordmark">
        <span class="wordmark-mark" aria-hidden="true">↗</span>
        <span>url_safe <span class="beta-label">Bêta</span></span>
      </span>
    </header>

    <main>
      <aside class="beta-warning" aria-label="Avertissement version bêta">
        <strong>Version bêta — résultats indicatifs.</strong>
        La liste intégrée est limitée et ne détecte pas toutes les menaces.
        L’absence d’alerte ne garantit pas qu’un lien est sûr : vérifiez-le
        vous-même avant de l’ouvrir.
      </aside>

      <form id="check-form" class="check-form">
        <label for="url-input">Adresse du lien</label>
        <div class="input-row">
          <input
            id="url-input"
            name="url"
            type="text"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="https://exemple.com/..."
            maxlength="2048"
            required
            aria-describedby="privacy-note"
          >
          <button id="check-button" type="submit">
            <span>Vérifier</span>
          </button>
        </div>
        <p id="privacy-note" class="privacy-note">
          <span aria-hidden="true">◉</span>
          L’adresse vérifiée est analysée sur votre appareil; elle n’est pas envoyée.
        </p>
      </form>

      <section id="result" class="result" aria-live="polite" hidden></section>
    </main>

    <footer class="popup-footer">
      <button id="options-button" class="link-button" type="button">Options</button>
    </footer>
  </body>
</html>
