<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5ef">
    <title>Lien clair | Résultat</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="result.css">
    <script src="result.js" type="module"></script>
  </head>
  <body>
    <header class="page-header">
      <span class="wordmark">
        <span class="wordmark-mark" aria-hidden="true">↗</span>
        <span>lien clair</span>
      </span>
      <span class="page-note">Analyse locale</span>
    </header>

    <main>
      <section class="checker" aria-labelledby="page-title">
        <p class="eyebrow">Lien vérifié</p>
        <h1 id="page-title">Ce que montre<br><span>cette adresse.</span></h1>
        <p id="checked-url" class="checked-url"></p>

        <section id="result" class="result" aria-live="polite" hidden></section>
      </section>

      <section class="bottom-note" aria-label="Limite de l’analyse">
        <span class="note-mark" aria-hidden="true">!</span>
        <p><strong>Aucun outil ne peut garantir qu’un lien est sûr.</strong> Un domaine connu ou populaire peut être compromis; un domaine inconnu n’est pas forcément dangereux.</p>
      </section>
    </main>

    <footer>
      <span>LIEN CLAIR <span class="footer-separator">/</span> EXTENSION</span>
      <span>Analyse sans navigation</span>
    </footer>
  </body>
</html>
